name: Frontend CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/erp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/erp-frontend:latest

            # Stop and remove old container
            docker stop erp-frontend || true
            docker rm erp-frontend || true

            # Run new container.
            # Publish on the docker bridge gateway only, not 0.0.0.0: iums-nginx sits on the
            # compose network and reaches this container through host.docker.internal, which
            # resolves to 172.17.0.1. Binding there keeps nginx working while taking the
            # plain-HTTP copy of the app off the internet.
            docker run -d \
              --name erp-frontend \
              --restart unless-stopped \
              -p 172.17.0.1:5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/erp-frontend:latest

            # The port is no longer reachable from the runner, so check it from the server.
            sleep 5
            curl -fsS -o /dev/null http://172.17.0.1:5000/health && echo "erp-frontend reachable from the bridge gateway"

            # Clean up old images
            docker image prune -af --filter "until=24h"

            # Show running containers
            docker ps

      - name: Verify deployment
        run: |
          # Check the path real users take (nginx -> erp-frontend), not the raw container port:
          # that port is bound to the docker bridge gateway and is unreachable from here.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null --max-time 15 https://jafaiums.uz/; then
              echo "https://jafaiums.uz/ is serving the app"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "jafaiums.uz did not serve the app after the deploy"
          exit 1
