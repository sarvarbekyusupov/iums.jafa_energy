server {
    listen 5000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hashed build output: the filename changes whenever the content does, so it is safe
    # to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached. It is the file that names the hashed chunks above, so a
    # stale copy sends the browser after chunk filenames that no longer exist after a deploy
    # and the app dies with "error loading dynamically imported module". It carried no
    # Cache-Control at all, which let browsers cache it heuristically.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Handle React Router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No /api block here on purpose. The public reverse proxy matches /api before it ever
    # reaches this container, so this was dead config, and it pointed at the server's public
    # IP on plain port 3000, which is now closed. Leaving it would be a trap for whoever
    # changes the routing next.

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
